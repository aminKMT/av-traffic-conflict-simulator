name: Bug report
description: Report a reproducible simulator problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Scenario/configuration
      description: Include values needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: browser
    attributes:
      label: Browser and OS
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console output
